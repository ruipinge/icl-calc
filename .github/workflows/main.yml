name: main

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE on Node version: .nvmrc pins Node 16 because `npm run build`
      # fails on 18/20/22 (ERR_PACKAGE_PATH_NOT_EXPORTED from an old
      # postcss dependency) - see Phase 0. That constraint is build-only:
      # lint and test have been verified to pass identically on Node 16,
      # 18, 20 and 22. This job does not build, so it intentionally does
      # NOT track .nvmrc and instead pins Node 20 directly, because Node
      # 16 is EOL and does not install reliably via actions/setup-node on
      # current ubuntu-latest runners. The `deploy` job below still uses
      # Node 16 since it does build.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      # WORKAROUND: package-lock.json is lockfileVersion 2 but has no
      # "packages" object, so `npm ci` on modern npm links zero bins into
      # node_modules/.bin (eslint, react-scripts, etc. all "command not
      # found"). We can't regenerate the lockfile without invalidating the
      # golden-master verification against the pinned 2022 dependency
      # tree, so repair the bin symlinks ourselves. See scripts/link-bins.js.
      - name: Repair node_modules/.bin symlinks
        run: node scripts/link-bins.js

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test 2>&1 | tee test-output.log

      - name: Write coverage summary
        if: always()
        run: |
          {
            echo '## Coverage summary'
            echo
            echo '```'
            sed -n '/^File/,/^Ran all test suites/p' test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: ['test']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Repair node_modules/.bin symlinks
        run: node scripts/link-bins.js

      - name: Version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Build
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
