name: main

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE on Node version: CRA/webpack 4 is gone as of Phase 3a task 4, so
      # the old Node-16-only build constraint (ERR_PACKAGE_PATH_NOT_EXPORTED
      # above Node 16 - see Phase 0) no longer exists, and every job in this
      # workflow now runs on the single version pinned in .nvmrc. That
      # version floor is set by Vitest, which declares engines.node
      # "^18.0.0 || >=20.0.0" and crashes immediately on Node 16
      # (`crypto$2.getRandomValues is not a function`) rather than failing
      # gracefully - see the Phase 3a plan and task-3 fix report. Node 22 was
      # walked and verified (lint, typecheck, test, build, L2 replay all
      # green) before being adopted - see the task-5 report.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # No --legacy-peer-deps: #50 upgraded @sentry/react to v10 and
      # replaced react-ga with react-ga4, the two packages that used to cap
      # peer ranges at React 18 and forced this flag on since Phase 3b.
      # With it gone, npm's peer resolution is back on for every install
      # in this workflow - which is the point ahead of #49 (router 5 -> 7):
      # a real peer conflict introduced by that upgrade will now fail loud
      # here instead of installing silently.
      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        # Without an explicit shell:, GitHub Actions runs this under
        # `bash -e {0}` (no pipefail), so the step's exit status is
        # tee's (always 0) rather than npm test's - a failing test suite
        # would go green. `shell: bash` switches Actions' default
        # invocation to `bash --noprofile --norc -eo pipefail {0}`,
        # which makes the step fail when npm test does.
        shell: bash
        run: npm test 2>&1 | tee test-output.log

      - name: Write coverage summary
        if: always()
        run: |
          {
            echo '## Coverage summary'
            echo
            echo '```'
            # The end pattern '^Ran all test suites' is a Jest string that
            # Vitest never prints, so this range is open-ended in practice:
            # it runs from the coverage table header to EOF. That is
            # deliberate, not an accidental leftover from the Jest->Vitest
            # migration - Vitest prints the coverage table last, after all
            # test results, so "everything from '^File' to EOF" is exactly
            # the coverage table on every run. Left unpaired (rather than
            # invented a Vitest terminator) because there is nothing after
            # it in test-output.log to accidentally slurp in.
            sed -n '/^File/,$p' test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  golden-master-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone: the merge-base
          # comparison below needs it.
          fetch-depth: 0

      # Design spec section 7.3 (the stop rule) says: "CI enforces the
      # branch-name condition mechanically, so the fixture cannot drift by
      # accident." Until this job existed, no such job did - nothing in
      # this workflow read expected.json or checked for an oracle/ branch
      # prefix (see the "Correction" note appended to spec 7.3, issue #45).
      # This is that job.
      #
      # Guarded paths: src/golden/expected.json (the golden-master
      # snapshot itself) and src/data.csv (the 542-row clinical dataset
      # those values are computed from). A silent edit to the CSV is at
      # least as dangerous as one to expected.json - it moves the inputs
      # instead of the outputs - and until this guard existed it was
      # unprotected by anything except assertions inside the `test` job,
      # which Critical 1 showed could not fail.
      - name: Enforce the expected.json / data.csv stop rule (design spec 7.3)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          CHANGED="$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA" -- src/golden/expected.json src/data.csv)"

          if [ -z "$CHANGED" ]; then
            echo "src/golden/expected.json and src/data.csv are unchanged against the merge base ($MERGE_BASE). OK."
            exit 0
          fi

          # Case-sensitive on purpose: 'Oracle/x' or 'ORACLE/x' falls through to
          # the failure branch below, not this one. That's the fail-safe
          # direction - don't "fix" it into a case-insensitive match.
          case "$HEAD_REF" in
            oracle/*)
              echo "Guarded file(s) changed on an approved oracle/ branch ('$HEAD_REF'). OK. Changed:"
              echo "$CHANGED"
              echo "This still requires the written per-value justification and explicit sign-off spec 7.3 calls for - confirm that happened in review."
              exit 0
              ;;
          esac

          {
            echo "::error::Guarded golden-master file(s) were modified on branch '$HEAD_REF', which is not an oracle/ branch. Changed:"
            echo "$CHANGED"
            echo
            echo "Design spec section 7.3 (the stop rule):"
            echo '  "If a value in expected.json moves, work stops. No fixing forward, no'
            echo '   regenerating the fixture, no assuming it is rounding."'
            echo "The same rule covers src/data.csv: it is the input the golden master is"
            echo "computed from, so an undeclared edit there is the same class of risk."
            echo
            echo "A deliberate correction to the golden master requires a dedicated oracle/*"
            echo "branch, a written justification per changed value, and explicit sign-off"
            echo "before expected.json or data.csv is touched (spec 7.3, 'Deliberate correction')."
            echo
            echo "If this diff is a real regression: revert it, don't edit the fixture."
            echo "If it is a deliberate, reviewed correction to the recorded oracle values:"
            echo "re-open this change from a branch named oracle/<something>, with that"
            echo "justification and sign-off recorded in the PR description."
          } >&2
          exit 1

  e2e-replay:
    runs-on: ubuntu-latest
    needs: ['test']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # L2 needs a real production build of this branch to replay against,
      # and Playwright needs Node 18+. Both now run on the single version
      # pinned in .nvmrc - see the NOTE in the `test` job above. The old
      # split (Node 16 to build, then Node 20 for Playwright) existed only
      # because CRA's build required 16 while Playwright required 18+; that
      # build constraint is gone as of Phase 3a task 4.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      # No --legacy-peer-deps: see the comment on the `test` job's install
      # step above.
      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Build
        run: npm run build

      - name: Install e2e dependencies
        run: npm ci --prefer-offline
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      # Subject-only: there is no oracle worktree on a runner, and L2's
      # replay project doesn't need one - it replays this build's rendered
      # output against the already-captured src/golden/expected.json. See
      # the comment in e2e/setup.sh for why the oracle checks stay a loud
      # failure for the capture/smoke path.
      - name: e2e setup (subject-only)
        run: ./setup.sh --subject-only
        working-directory: e2e

      - name: L2 replay
        env:
          SUBJECT_ONLY: '1'
        run: npm run replay
        working-directory: e2e

  deploy:
    # golden-master-guard is pull_request-only (see its own `if:` above), so
    # on this job's actual trigger - a push to master - it never runs and
    # its `needs` result is 'skipped', not 'success'. GitHub's default
    # "run only if every needed job succeeded" rule treats a skipped
    # dependency the same as a failed one, which would make this job skip
    # forever if golden-master-guard were added to `needs` unguarded - a
    # silent, permanent outage of the release path.
    #
    # !cancelled() (not always()) is what fixes that without introducing a
    # worse problem. A plain `if:` gets an implicit success() check, which
    # also gives it implicit cancellation protection: cancel the run and
    # success() goes false, so the job auto-skips. always() discards that
    # protection along with the default-skip behaviour, which would let
    # this job - semantic-release plus the gh-pages publish, the actual
    # release of a clinical tool - run to completion even after an
    # operator hits Cancel workflow. !cancelled() only overrides the
    # "skip if any dependency didn't succeed" default; it still evaluates
    # false the moment the run is cancelled, so Cancel workflow remains an
    # effective stop button here. The explicit needs.*.result checks below
    # do the rest: block on a real failure of any gate (test, e2e-replay,
    # or - on the rare path where golden-master-guard did run - a failed
    # guard), but do not block on golden-master-guard's expected 'skipped'
    # result on this trigger.
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/master' &&
      needs.test.result == 'success' &&
      needs.e2e-replay.result == 'success' &&
      (needs.golden-master-guard.result == 'success' || needs.golden-master-guard.result == 'skipped')
    runs-on: ubuntu-latest
    needs: ['test', 'e2e-replay', 'golden-master-guard']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # See the NOTE in the `test` job above - every job now runs on the
      # single version pinned in .nvmrc.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # No --legacy-peer-deps: see the comment on the `test` job's install
      # step above.
      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # No build-time environment is needed. Sentry's DSN is hardcoded in
      # src/index.tsx (a DSN is public by design and write-only), and this
      # app ships no analytics - see the Phase 4a note in
      # docs/modernization-findings.md.
      - name: Build
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
