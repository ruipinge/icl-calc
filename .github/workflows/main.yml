name: Verify and release

on:
  # `push:` is scoped to main, not left bare. Bare, it fires on every
  # branch - so every push to a PR branch ran this whole workflow TWICE,
  # once for the push and once for the pull_request, building the app and
  # driving a real browser both times for an identical result. The push run
  # produced nothing the PR run did not: golden-master-guard is
  # pull_request-only and deploy is main-only, so it was a duplicate of
  # exactly the expensive half.
  #
  # `main` still needs the push trigger - that is what runs deploy.
  #
  # Trade accepted: a branch with no PR open now gets no CI. The workflow
  # here is always worktree -> branch -> PR, so nothing is lost, but pushing
  # a throwaway branch expecting a green tick will no longer get one.
  #
  # `treeye-reskin` is the #120 integration branch, added so that merging a
  # phase-0 or phase-1 pull request into it publishes the preview below
  # (#121). It cuts no version and cannot reach production: `deploy` is gated
  # on `refs/heads/main`, and the preview publishes into a `preview/`
  # subdirectory of gh-pages rather than its root.
  push:
    branches: [main, treeye-reskin]
  pull_request:

concurrency:
  # Push three times in five minutes and you currently get three full runs,
  # two of them obsolete before they finish. This collapses them.
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs only. NEVER cancel a `main` run: that is the
  # one that executes semantic-release and then publishes to gh-pages, so
  # killing it midway can leave a version tagged with nothing deployed, or a
  # release created against a build that never shipped. Runs on `main` queue
  # behind each other instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job ids (test, golden-master-guard, e2e-replay, deploy) are referenced by
# `needs:` and by branch protection's required-status-check rules. Renaming
# an id silently stops a required check being enforced, so the ids are
# fixed: the human-readable `name:` on each job is what changes when the
# wording needs to improve.
jobs:
  test:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    # Only what the coverage comment below needs. Declaring permissions on
    # this job narrows the default GITHUB_TOKEN scope for it rather than
    # widening it - every other job keeps the repository default.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the branch under test
        uses: actions/checkout@v7

      # NOTE on Node version: CRA/webpack 4 is gone as of Phase 3a task 4, so
      # the old Node-16-only build constraint (ERR_PACKAGE_PATH_NOT_EXPORTED
      # above Node 16 - see Phase 0) no longer exists, and every job in this
      # workflow now runs on the single version pinned in .nvmrc. That
      # version floor is set by Vitest, which declares engines.node
      # "^18.0.0 || >=20.0.0" and crashes immediately on Node 16
      # (`crypto$2.getRandomValues is not a function`) rather than failing
      # gracefully - see the Phase 3a plan and task-3 fix report. Node 22 was
      # walked and verified (lint, typecheck, test, build, L2 replay all
      # green) before being adopted - see the task-5 report.
      - name: Set up the Node version pinned in .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # No --legacy-peer-deps: #50 upgraded @sentry/react to v10 and
      # replaced react-ga with react-ga4, the two packages that used to cap
      # peer ranges at React 18 and forced this flag on since Phase 3b.
      # With it gone, npm's peer resolution is back on for every install
      # in this workflow - which is the point ahead of #49 (router 5 -> 7):
      # a real peer conflict introduced by that upgrade will now fail loud
      # here instead of installing silently.
      - name: Install locked dependencies (peer conflicts fail here)
        run: npm ci --prefer-offline

      - name: Verify the source lints clean (ESLint)
        run: npm run lint

      # Formatting is no longer enforced by `npm run lint`. #63 removed
      # eslint-plugin-prettier - running Prettier as an ESLint rule coupled
      # the two versions together, which is what blocked upgrading either
      # (see #76) - so Prettier is now its own check and needs its own step.
      # Without this, the project silently stops checking formatting at all.
      - name: Verify the source is Prettier-formatted
        run: npm run format:check

      - name: Verify TypeScript types compile
        run: npx tsc --noEmit

      - name: Unit tests, L1 golden-master replay and coverage floors
        # Without an explicit shell:, GitHub Actions runs this under
        # `bash -e {0}` (no pipefail), so the step's exit status is
        # tee's (always 0) rather than npm test's - a failing test suite
        # would go green. `shell: bash` switches Actions' default
        # invocation to `bash --noprofile --norc -eo pipefail {0}`,
        # which makes the step fail when npm test does.
        shell: bash
        run: npm test 2>&1 | tee test-output.log

      - name: Publish the coverage table to the run summary
        if: always()
        run: |
          {
            echo '## Coverage summary'
            echo
            echo '```'
            # The end pattern '^Ran all test suites' is a Jest string that
            # Vitest never prints, so this range is open-ended in practice:
            # it runs from the coverage table header to EOF. That is
            # deliberate, not an accidental leftover from the Jest->Vitest
            # migration - Vitest prints the coverage table last, after all
            # test results, so "everything from '^File' to EOF" is exactly
            # the coverage table on every run. Left unpaired (rather than
            # invented a Vitest terminator) because there is nothing after
            # it in test-output.log to accidentally slurp in.
            sed -n '/^File/,$p' test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Replaces the comment Codecov used to post (#46), using a
      # first-party action rather than a marketplace one - the whole point
      # of dropping Codecov was to shrink third-party surface, so pulling in
      # someone else's coverage-comment action would have traded one
      # dependency for another.
      #
      # This is reporting, not a gate. The gate is `thresholds` in
      # vite.config.ts, which fails the unit-test step above before this runs.
      # `if: always()` is deliberate: on a threshold failure the numbers are
      # exactly what a reviewer wants to see, so the comment must still post
      # on a red run. It is scoped to `success() || failure()` rather than a
      # bare always() so that cancelling the workflow does not still write a
      # comment.
      # Replaces the comment Codecov used to post (#46), using a
      # first-party action rather than a marketplace one - the whole point
      # of dropping Codecov was to shrink third-party surface, so pulling in
      # someone else's coverage-comment action would have traded one
      # dependency for another.
      #
      # The logic lives in .github/scripts/coverage-comment.js rather than
      # inline here, so it is a real file: editable with tooling, diffable,
      # and runnable outside CI. Only the three objects github-script
      # injects are passed through. require() resolves relative to the
      # action's own directory, not the workspace, hence the explicit
      # GITHUB_WORKSPACE path.
      #
      # This is reporting, not a gate. The gate is `thresholds` in
      # vite.config.ts, which fails the unit-test step above before this runs.
      # `success() || failure()` (rather than a bare always()) is
      # deliberate: on a threshold failure the numbers are exactly what a
      # reviewer wants, so the comment must still post on a red run - but
      # cancelling the workflow should not write one.
      - name: Report the coverage numbers as a PR comment
        if: (success() || failure()) && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const comment = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/coverage-comment.js`
            );
            await comment({ github, context, core });

  golden-master-guard:
    name: Golden-master stop rule (expected.json, data.csv)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history for the merge-base comparison
        uses: actions/checkout@v7
        with:
          # Full history, not the default shallow clone: the merge-base
          # comparison below needs it.
          fetch-depth: 0

      # Design spec section 7.3 (the stop rule) says: "CI enforces the
      # branch-name condition mechanically, so the fixture cannot drift by
      # accident." Until this job existed, no such job did - nothing in
      # this workflow read expected.json or checked for an oracle/ branch
      # prefix (see the "Correction" note appended to spec 7.3, issue #45).
      # This is that job.
      #
      # Guarded paths: src/golden/expected.json (the golden-master
      # snapshot itself) and src/data.csv (the 542-row clinical dataset
      # those values are computed from). A silent edit to the CSV is at
      # least as dangerous as one to expected.json - it moves the inputs
      # instead of the outputs - and until this guard existed it was
      # unprotected by anything except assertions inside the `test` job,
      # which Critical 1 showed could not fail.
      - name: Enforce the expected.json / data.csv stop rule (design spec 7.3)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"

          # A guarded file can be absent from the merge base rather than
          # modified in it. That is not hypothetical: the final Phase 5 merge
          # of `modernize` into the default branch (then named `master`, since
          # renamed to `main`) is exactly this case, because that branch
          # predates Phase 1 and had never carried expected.json. Comparing
          # naively against the base reports the file as "changed" and blocks
          # the release - the guard cannot tell "someone edited the fixture"
          # from "the fixture is arriving here for the first time".
          #
          # The fix is a real check, not an exemption. When a guarded file is
          # absent from the base, compare the incoming version against the
          # commit that first ADDED it. Identical means it is being
          # introduced exactly as captured, which is the only legitimate way
          # for it to appear. Different means it drifted between capture and
          # here, which is precisely what this job exists to stop, and it
          # falls through to the failure branch below.
          CHANGED=""
          for FILE in src/golden/expected.json src/data.csv; do
            if git cat-file -e "$MERGE_BASE:$FILE" 2>/dev/null; then
              if ! git diff --quiet "$MERGE_BASE" "$HEAD_SHA" -- "$FILE"; then
                CHANGED="$CHANGED$FILE"$'\n'
              fi
              continue
            fi

            ADDED_IN="$(git log --diff-filter=A --format=%H "$HEAD_SHA" -- "$FILE" | tail -1)"
            if [ -z "$ADDED_IN" ]; then
              echo "::error::$FILE is absent from the merge base and has no add commit reachable from HEAD. Refusing to guess."
              CHANGED="$CHANGED$FILE"$'\n'
            elif git diff --quiet "$ADDED_IN" "$HEAD_SHA" -- "$FILE"; then
              echo "$FILE is absent from the merge base ($MERGE_BASE) and is being introduced byte-identical to its original capture in $ADDED_IN. OK."
            else
              echo "::error::$FILE has drifted since it was captured in $ADDED_IN."
              CHANGED="$CHANGED$FILE"$'\n'
            fi
          done
          CHANGED="$(printf '%s' "$CHANGED")"

          if [ -z "$CHANGED" ]; then
            echo "src/golden/expected.json and src/data.csv are intact against the merge base ($MERGE_BASE). OK."
            exit 0
          fi

          # Case-sensitive on purpose: 'Oracle/x' or 'ORACLE/x' falls through to
          # the failure branch below, not this one. That's the fail-safe
          # direction - don't "fix" it into a case-insensitive match.
          case "$HEAD_REF" in
            oracle/*)
              echo "Guarded file(s) changed on an approved oracle/ branch ('$HEAD_REF'). OK. Changed:"
              echo "$CHANGED"
              echo "This still requires the written per-value justification and explicit sign-off spec 7.3 calls for - confirm that happened in review."
              exit 0
              ;;
          esac

          {
            echo "::error::Guarded golden-master file(s) were modified on branch '$HEAD_REF', which is not an oracle/ branch. Changed:"
            echo "$CHANGED"
            echo
            echo "Design spec section 7.3 (the stop rule):"
            echo '  "If a value in expected.json moves, work stops. No fixing forward, no'
            echo '   regenerating the fixture, no assuming it is rounding."'
            echo "The same rule covers src/data.csv: it is the input the golden master is"
            echo "computed from, so an undeclared edit there is the same class of risk."
            echo
            echo "A deliberate correction to the golden master requires a dedicated oracle/*"
            echo "branch, a written justification per changed value, and explicit sign-off"
            echo "before expected.json or data.csv is touched (spec 7.3, 'Deliberate correction')."
            echo
            echo "If this diff is a real regression: revert it, don't edit the fixture."
            echo "If it is a deliberate, reviewed correction to the recorded oracle values:"
            echo "re-open this change from a branch named oracle/<something>, with that"
            echo "justification and sign-off recorded in the PR description."
          } >&2
          exit 1

  e2e-replay:
    name: L2 browser replay of the golden master
    runs-on: ubuntu-latest
    needs: ['test']
    steps:
      - name: Check out the branch under test
        uses: actions/checkout@v7

      # L2 needs a real production build of this branch to replay against,
      # and Playwright needs Node 18+. Both now run on the single version
      # pinned in .nvmrc - see the NOTE in the `test` job above. The old
      # split (Node 16 to build, then Node 20 for Playwright) existed only
      # because CRA's build required 16 while Playwright required 18+; that
      # build constraint is gone as of Phase 3a task 4.
      - name: Set up the Node version pinned in .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      # No --legacy-peer-deps: see the comment on the `test` job's install
      # step above.
      - name: Install locked dependencies (peer conflicts fail here)
        run: npm ci --prefer-offline

      - name: Build the production bundle the replay runs against
        run: npm run build

      - name: Install the e2e harness's own locked dependencies
        run: npm ci --prefer-offline
        working-directory: e2e

      - name: Install the Chromium build Playwright drives
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      # Subject-only: there is no oracle worktree on a runner, and L2's
      # replay project doesn't need one - it replays this build's rendered
      # output against the already-captured src/golden/expected.json. See
      # the comment in e2e/setup.sh for why the oracle checks stay a loud
      # failure for the capture/smoke path.
      - name: Prepare the e2e harness (subject build only, no oracle worktree)
        run: ./setup.sh --subject-only
        working-directory: e2e

      - name: Verify the rendered output still matches expected.json (L2)
        env:
          SUBJECT_ONLY: '1'
        run: npm run replay
        working-directory: e2e

      # Visual and structural coverage for all four routes plus the shell
      # (#121). Until this step existed, nothing in CI could observe a visual
      # regression: L1 asserted authored class strings, L2 asserts computed
      # values, and `histogram-visual.spec.ts` - often described as the
      # visual coverage - is a capture tool its own header says never runs in
      # CI. It did not: the only Playwright invocation in this workflow was
      # `--project=replay`.
      #
      # Runs inside the official Playwright container rather than on the
      # runner directly. Screenshots are pixel fixtures and therefore
      # platform-bound, so the baselines a maintainer generates and the
      # pixels this step compares them against have to come from the same
      # browser build, the same OS and the same fonts. Generated locally with
      # the identical command - see e2e/README.md. The image tag tracks the
      # @playwright/test version in e2e/package-lock.json and must be bumped
      # with it, or the browsers differ from the ones the tests were written
      # against.
      #
      # Placed in this job, after the replay step, rather than in a job of
      # its own: both drive the subject build on port 4022 with
      # `reuseExistingServer: true`, so two concurrent runs would leave the
      # second silently validating the first's build.
      #
      - name: Verify every route still looks and reads as expected (visual)
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work/e2e -e SUBJECT_ONLY=1 \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            npx playwright test --project=visual-assert

      # On a disagreement Playwright writes three images per failure:
      # `-expected` (the committed baseline, i.e. how the page looks on the
      # branch this is compared against), `-actual` (how it looks now) and
      # `-diff`. Uploading them is what makes a visual failure reviewable
      # without checking the branch out - and it is how the #122 reskin gets
      # compared against the current look, since every baseline it moves
      # produces exactly this triple.
      #
      # `if: failure()` rather than always(): on a green run these files do
      # not exist, and an artifact per run of a passing gate is noise. The
      # L2 replay step above can also fail and leave nothing behind, hence
      # if-no-files-found: ignore rather than a spurious red on the upload.
      #
      # v7 matches the actions/checkout and actions/setup-node majors already
      # used in this workflow, and is what dependabot's github-actions
      # ecosystem will keep current.
      - name: Upload the visual diffs when they disagree
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Release and publish to gh-pages
    # golden-master-guard is pull_request-only (see its own `if:` above), so
    # on this job's actual trigger - a push to main - it never runs and
    # its `needs` result is 'skipped', not 'success'. GitHub's default
    # "run only if every needed job succeeded" rule treats a skipped
    # dependency the same as a failed one, which would make this job skip
    # forever if golden-master-guard were added to `needs` unguarded - a
    # silent, permanent outage of the release path.
    #
    # !cancelled() (not always()) is what fixes that without introducing a
    # worse problem. A plain `if:` gets an implicit success() check, which
    # also gives it implicit cancellation protection: cancel the run and
    # success() goes false, so the job auto-skips. always() discards that
    # protection along with the default-skip behaviour, which would let
    # this job - semantic-release plus the gh-pages publish, the actual
    # release of a clinical tool - run to completion even after an
    # operator hits Cancel workflow. !cancelled() only overrides the
    # "skip if any dependency didn't succeed" default; it still evaluates
    # false the moment the run is cancelled, so Cancel workflow remains an
    # effective stop button here. The explicit needs.*.result checks below
    # do the rest: block on a real failure of any gate (test, e2e-replay,
    # or - on the rare path where golden-master-guard did run - a failed
    # guard), but do not block on golden-master-guard's expected 'skipped'
    # result on this trigger.
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' &&
      needs.e2e-replay.result == 'success' &&
      (needs.golden-master-guard.result == 'success' || needs.golden-master-guard.result == 'skipped')
    runs-on: ubuntu-latest
    needs: ['test', 'e2e-replay', 'golden-master-guard']

    # gh-pages now has two writers - this job and preview-gh-pages below - so
    # they are serialised against each other. Both push to the same branch,
    # and two pushes racing produce either a rejected non-fast-forward or one
    # silently clobbering the other's commit.
    #
    # cancel-in-progress is false, and must stay false: this job runs
    # semantic-release and then publishes the live clinical tool, so a queued
    # run has to wait rather than kill the one holding the lock. The group is
    # deliberately NOT parameterised by ref - serialising per-branch would
    # defeat the point, since the two writers are on different branches.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false

    steps:
      - name: Check out the commit being released
        uses: actions/checkout@v7

      # See the NOTE in the `test` job above - every job now runs on the
      # single version pinned in .nvmrc.
      - name: Set up the Node version pinned in .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # No --legacy-peer-deps: see the comment on the `test` job's install
      # step above.
      - name: Install locked dependencies (peer conflicts fail here)
        run: npm ci --prefer-offline

      # semantic-release reads the conventional commits since the last tag,
      # decides the next version, writes it into the workspace package.json
      # (@semantic-release/npm's prepare step runs `npm version
      # --no-git-tag-version` regardless of `private: true`, which only
      # suppresses the registry publish), pushes the git tag and cuts the
      # GitHub release. It must run BEFORE the build below, because
      # vite.config.ts bakes package.json's version into
      # import.meta.env.VITE_APP_VERSION and the Footer renders it.
      #
      # @semantic-release/git is deliberately NOT in the plugin list: it
      # would commit the bumped package.json back to this branch, and a
      # protected default branch can reject its own release commit and break
      # every subsequent deploy. The accepted cost is that the version
      # committed in git stays behind the released version.
      #
      # That cost was understated: it reaches the artifact, not just the
      # repository. semantic-release only rewrites package.json when it
      # actually cuts a release, so on a ci:/chore: push - which still
      # deploys - the build falls back to the committed version and the
      # footer reports it. Observed live: the vite 8 upgrade (chore:, no
      # release) shipped reporting v1.8.3 while the current release was
      # v1.9.0, so the footer's version link pointed two releases back. The
      # version does not merely lag, it oscillates: correct after a
      # releasing commit, stale on the next non-releasing one. The step
      # below fixes that at the source rather than by restoring the plugin
      # and its protection bypass.
      - name: Decide the next version, tag it and cut the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # The version the build should report, taken from the release tags
      # rather than the committed package.json, which is frozen at whatever
      # was committed when @semantic-release/git was removed.
      #
      # Correct in both cases by construction. If semantic-release just cut
      # a release, its tag is the highest and matches the package.json it
      # rewrote. If it cut nothing, the highest tag is still the release
      # this build descends from, while package.json is stale. So the
      # highest tag is right either way, and no branching is needed.
      #
      # Tags are re-fetched because actions/checkout does not fetch them by
      # default, and filtered to `v*` because this repo also carries the
      # annotated `golden-master-oracle` tag, whose ordering under
      # `-v:refname` is not something to depend on. `--sort` is used rather
      # than `git describe`, which needs commit ancestry this shallow
      # checkout does not have.
      - name: Resolve the version this build should report
        run: |
          git fetch --tags --force --quiet
          version="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          version="${version#v}"
          if [ -z "$version" ]; then
            version="$(node -p "require('./package.json').version")"
            echo "No v* tag found; falling back to package.json: $version"
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "This build will report version $version"

      # No build-time environment is needed beyond APP_VERSION above.
      # Sentry's DSN is hardcoded in src/index.tsx (a DSN is public by
      # design and write-only), and this app ships no analytics - see the
      # Phase 4a note in docs/modernization-findings.md.
      - name: Build the bundle at the version just released
        run: npm run build

      # keep_files is REQUIRED here, and it is the one change in #121 that
      # touches the production release path. This action wipes the publish
      # branch before copying by default, so without it the next release to
      # main deletes the `preview/` directory the job below publishes - and
      # deletes it silently, since nothing about the production deploy would
      # look wrong.
      #
      # The accepted cost, decided by the owner on 2026-09-10: content-hashed
      # bundles now accumulate on gh-pages indefinitely, for production as
      # well as for the preview. Slow on a repository that ships a few times a
      # month, prunable by hand, and deliberately NOT automated here - an
      # automatic pruner on the branch that serves a live clinical tool is a
      # worse risk than a large branch.
      - name: Publish ./build to gh-pages (the live clinical tool)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          keep_files: true

  preview-gh-pages:
    name: Publish the integration-branch preview to gh-pages
    # Push to the integration branch only. Never on main, never on a pull
    # request: a PR from a fork would otherwise get a token that can write to
    # the branch serving the live tool.
    #
    # A plain `if:` keeps its implicit success() check, so this still skips
    # when `test` or `e2e-replay` fails - the preview is never published from
    # a build that did not pass the gates. See the long note on `deploy` for
    # why that implicit check matters.
    if: github.event_name == 'push' && github.ref == 'refs/heads/treeye-reskin'
    runs-on: ubuntu-latest
    needs: ['test', 'e2e-replay']

    # See the note on `deploy`: both jobs write gh-pages and must not race.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false

    steps:
      - name: Check out the integration branch
        uses: actions/checkout@v7

      - name: Set up the Node version pinned in .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install locked dependencies (peer conflicts fail here)
        run: npm ci --prefer-offline

      # The ONLY destination in this project that needs a base override. The
      # app is built for /icl-calc/ everywhere else - production today, and
      # tools.treeye.science/icl-calc/ after #123 - but this stopgap serves
      # from a subdirectory of that, so `base` has to move with it or every
      # asset 404s against the production path.
      #
      # Two consequences, both reasons to retire this the moment the
      # Cloudflare preview is up rather than run both indefinitely:
      #
      #   - these are NOT the bytes L2 validated. It validated a /icl-calc/
      #     build; this is a second build differing only in base, so the
      #     preview ships an artifact no gate ran against.
      #   - it is the only place `import.meta.env.BASE_URL` takes a value the
      #     shipped app never uses, which is exactly the divergence
      #     vite.config.ts's test.env pin exists to prevent elsewhere.
      #
      # No version is cut: semantic-release runs in `deploy`, which is gated
      # on main and never runs here.
      - name: Build for the preview sub-path
        run: npm run build -- --base=/icl-calc/preview/

      # destination_dir scopes the publish to preview/, and keep_files stops
      # it wiping the production build at the branch root - the same hazard,
      # in the opposite direction, as the keep_files on `deploy`. Without it
      # the first preview publish takes the live clinical tool offline.
      - name: Publish ./build to gh-pages under preview/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          destination_dir: preview
          keep_files: true

      - name: Report where the preview landed
        run: |
          {
            echo '## Preview published'
            echo
            echo '<https://ruipinge.github.io/icl-calc/preview/>'
            echo
            echo 'This is the **stopgap** preview. Once the Cloudflare Pages'
            echo 'project is wired in (#121), that one is authoritative and'
            echo 'this one is retired - see e2e/README.md and the issue.'
          } >> "$GITHUB_STEP_SUMMARY"

  preview-cloudflare:
    name: Publish the integration-branch preview to Cloudflare Pages
    # Same trigger and the same gating as preview-gh-pages: pushes to the
    # integration branch only, never main, never a pull request. A plain `if:`
    # keeps its implicit success() check, so nothing is published from a build
    # that failed a gate.
    if: github.event_name == 'push' && github.ref == 'refs/heads/treeye-reskin'
    runs-on: ubuntu-latest
    needs: ['test', 'e2e-replay']

    # Deliberately NOT in the gh-pages-publish concurrency group. This job
    # writes a Cloudflare project, never the gh-pages branch, so it cannot
    # race the release path and should not queue behind it.
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@v7

      - name: Set up the Node version pinned in .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install locked dependencies (peer conflicts fail here)
        run: npm ci --prefer-offline

      # No base override, unlike the gh-pages stopgap. This preview serves the
      # app at /icl-calc/, which is the base production uses today and the one
      # tools.treeye.science/icl-calc/ will use after #123 - so one value is
      # correct everywhere and there is nothing to parameterise.
      - name: Build the bundle to upload
        run: npm run build

      # Direct Upload serves the uploaded directory as the site root, but the
      # app must live at /icl-calc/ - so upload a wrapper, not the build.
      #
      # _headers goes at the root of the upload, NOT inside icl-calc/:
      # Cloudflare only reads it there.
      #
      # noindex is scoped to this preview hostname and never to the
      # application. Putting it in the app's own index.html would follow the
      # build into production and silently de-index the real tool - nothing
      # breaks, no test goes red, traffic just stops. #126 tracks re-enabling
      # indexing when #123 makes the Cloudflare deployment the live one.
      - name: Assemble the upload directory
        run: |
          set -euo pipefail
          rm -rf upload
          mkdir -p upload/icl-calc
          cp -r build/* upload/icl-calc/
          printf '/*\n  X-Robots-Tag: noindex\n' > upload/_headers
          test -f upload/icl-calc/index.html
          test -f upload/_headers
          echo "Upload tree:"
          find upload -maxdepth 2 -mindepth 1 | sort

      # Direct Upload, never the Git integration. The Git integration would
      # have Cloudflare build the application, shipping bytes that never
      # passed this repository's gates; this job runs only after `test` and
      # `e2e-replay` have passed on this commit.
      #
      # --branch is explicit and load-bearing. Cloudflare serves a deployment
      # at the stable <project>.pages.dev hostname only when it is a
      # PRODUCTION deployment of that project; a preview deployment gets a
      # per-commit <hash>.<project>.pages.dev alias instead. Wrangler infers
      # the branch from the CI environment, so without this an
      # integration-branch push would land as a preview alias and produce a
      # URL that changes on every push - which defeats the point of having a
      # reviewable one.
      #
      # CONFIRM THE RESULTING HOSTNAME ON THE FIRST REAL DEPLOY. If it comes
      # back as a hash alias, the project's production branch is not `main`
      # and this flag must match whatever it is.
      - name: Deploy the preview to Cloudflare Pages (Direct Upload)
        id: cf
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy upload --project-name=icl-calc-preview --branch=main

      # Reports the URL wrangler actually returned rather than the one this
      # workflow hopes for, and says so out loud when they differ.
      #
      # The project has no Git provider (confirmed by the owner), so it is
      # Direct Upload only - but a Pages project still has a production
      # branch, and a deployment whose --branch does not match it is a
      # PREVIEW deployment served at a per-commit <hash>.<project>.pages.dev
      # alias rather than at the stable hostname. Hoping and checking a
      # dashboard is how that goes unnoticed; a warning in the run is not.
      - name: Report where the preview landed
        env:
          DEPLOYMENT_URL: ${{ steps.cf.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.cf.outputs.pages-deployment-alias-url }}
        run: |
          set -uo pipefail
          STABLE='https://icl-calc-preview.pages.dev'

          {
            echo '## Cloudflare preview published'
            echo
            echo "Deployment URL: \`${DEPLOYMENT_URL:-<none reported>}\`"
            echo
            echo "Alias URL: \`${ALIAS_URL:-<none reported>}\`"
            echo
            echo "Expected stable entry point: <${STABLE}/icl-calc/>"
          } >> "$GITHUB_STEP_SUMMARY"

          # A production deployment is also reachable at the stable hostname;
          # a preview deployment is not. Compare on the alias when wrangler
          # reports one, since that is the stable-hostname candidate.
          if [ -n "${ALIAS_URL:-}" ] && [ "${ALIAS_URL}" = "${STABLE}" ]; then
            echo "Deployed to the stable hostname. OK."
          else
            echo "::warning::Cloudflare did not report ${STABLE} as this deployment's alias (deployment-url='${DEPLOYMENT_URL:-}', alias='${ALIAS_URL:-}'). That means --branch did not match the project's production branch, so this is a PREVIEW deployment on a per-commit hostname that changes every push. Set --branch to the project's production branch. See #121."
            {
              echo
              echo '> [!WARNING]'
              echo '> This landed as a **preview** deployment, not a production one,'
              echo "> so its hostname changes on every push. \`--branch\` in this job"
              echo '> does not match the projects production branch. See #121.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo
            echo 'This is the **authoritative** preview. The gh-pages one at'
            echo '`/icl-calc/preview/` is a stopgap and should be retired once'
            echo 'this URL is confirmed working (#121).'
            echo
            echo 'Not indexed: `_headers` sets `X-Robots-Tag: noindex` for the'
            echo 'whole hostname. #126 tracks re-enabling that when #123 makes'
            echo 'this deployment the live one.'
          } >> "$GITHUB_STEP_SUMMARY"

