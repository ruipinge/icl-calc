name: main

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE on Node version: this job's Node 20 pin is load-bearing, not
      # incidental, as of Phase 3a task 3. `npm test` runs Vitest, which
      # declares engines.node "^18.0.0 || >=20.0.0" and crashes immediately
      # on Node 16 (`crypto$2.getRandomValues is not a function`) rather
      # than failing gracefully - see the Phase 3a plan and task-3 fix
      # report. Lint and typecheck have no such floor and would run on 16
      # too, but there is no reason to split them out just to chase a
      # version this job doesn't otherwise need. This is unrelated to the
      # separate, older Node-16 build constraint below (`npm run build`
      # under CRA/webpack threw ERR_PACKAGE_PATH_NOT_EXPORTED above Node
      # 16 - see Phase 0): this job does not build, so that constraint
      # never reached it either way.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      # WORKAROUND: package-lock.json is lockfileVersion 2 but has no
      # "packages" object, so `npm ci` on modern npm links zero bins into
      # node_modules/.bin (eslint, react-scripts, etc. all "command not
      # found"). We can't regenerate the lockfile without invalidating the
      # golden-master verification against the pinned 2022 dependency
      # tree, so repair the bin symlinks ourselves. See scripts/link-bins.js.
      - name: Repair node_modules/.bin symlinks
        run: node scripts/link-bins.js

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test 2>&1 | tee test-output.log

      - name: Write coverage summary
        if: always()
        run: |
          {
            echo '## Coverage summary'
            echo
            echo '```'
            sed -n '/^File/,/^Ran all test suites/p' test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  golden-master-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone: the merge-base
          # comparison below needs it.
          fetch-depth: 0

      # Design spec section 7.3 (the stop rule) says: "CI enforces the
      # branch-name condition mechanically, so the fixture cannot drift by
      # accident." Until this job existed, no such job did - nothing in
      # this workflow read expected.json or checked for an oracle/ branch
      # prefix (see the "Correction" note appended to spec 7.3, issue #45).
      # This is that job.
      - name: Enforce the expected.json stop rule (design spec 7.3)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          CHANGED="$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA" -- src/golden/expected.json)"

          if [ -z "$CHANGED" ]; then
            echo "src/golden/expected.json is unchanged against the merge base ($MERGE_BASE). OK."
            exit 0
          fi

          # Case-sensitive on purpose: 'Oracle/x' or 'ORACLE/x' falls through to
          # the failure branch below, not this one. That's the fail-safe
          # direction - don't "fix" it into a case-insensitive match.
          case "$HEAD_REF" in
            oracle/*)
              echo "src/golden/expected.json changed, and branch '$HEAD_REF' is an approved oracle/ branch. OK."
              echo "This still requires the written per-value justification and explicit sign-off spec 7.3 calls for - confirm that happened in review."
              exit 0
              ;;
          esac

          {
            echo "::error::src/golden/expected.json was modified on branch '$HEAD_REF', which is not an oracle/ branch."
            echo
            echo "Design spec section 7.3 (the stop rule):"
            echo '  "If a value in expected.json moves, work stops. No fixing forward, no'
            echo '   regenerating the fixture, no assuming it is rounding."'
            echo
            echo "A deliberate correction to the golden master requires a dedicated oracle/*"
            echo "branch, a written justification per changed value, and explicit sign-off"
            echo "before expected.json is touched (spec 7.3, 'Deliberate correction')."
            echo
            echo "If this diff is a real regression: revert it, don't edit the fixture."
            echo "If it is a deliberate, reviewed correction to the recorded oracle values:"
            echo "re-open this change from a branch named oracle/<something>, with that"
            echo "justification and sign-off recorded in the PR description."
          } >&2
          exit 1

  e2e-replay:
    runs-on: ubuntu-latest
    needs: ['test']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # L2 needs a real production build of this branch to replay against.
      # Same Node-16 constraint as the `deploy` job below - see the NOTE in
      # the `test` job above and Phase 0.
      - name: Setup Node 16 (build)
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Repair node_modules/.bin symlinks
        run: node scripts/link-bins.js

      - name: Build
        run: npm run build

      # Playwright needs Node 18+. Switching versions mid-job (rather than
      # splitting into two jobs with an artifact hand-off) keeps this
      # simple and guarantees the build/ replayed against is the one just
      # produced above.
      - name: Setup Node 20 (Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci --prefer-offline
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      # Subject-only: there is no oracle worktree on a runner, and L2's
      # replay project doesn't need one - it replays this build's rendered
      # output against the already-captured src/golden/expected.json. See
      # the comment in e2e/setup.sh for why the oracle checks stay a loud
      # failure for the capture/smoke path.
      - name: e2e setup (subject-only)
        run: ./setup.sh --subject-only
        working-directory: e2e

      - name: L2 replay
        env:
          SUBJECT_ONLY: '1'
        run: npm run replay
        working-directory: e2e

  deploy:
    # golden-master-guard is pull_request-only (see its own `if:` above), so
    # on this job's actual trigger - a push to master - it never runs and
    # its `needs` result is 'skipped', not 'success'. GitHub's default
    # "run only if every needed job succeeded" rule treats a skipped
    # dependency the same as a failed one, which would make this job skip
    # forever if golden-master-guard were added to `needs` unguarded - a
    # silent, permanent outage of the release path.
    #
    # !cancelled() (not always()) is what fixes that without introducing a
    # worse problem. A plain `if:` gets an implicit success() check, which
    # also gives it implicit cancellation protection: cancel the run and
    # success() goes false, so the job auto-skips. always() discards that
    # protection along with the default-skip behaviour, which would let
    # this job - semantic-release plus the gh-pages publish, the actual
    # release of a clinical tool - run to completion even after an
    # operator hits Cancel workflow. !cancelled() only overrides the
    # "skip if any dependency didn't succeed" default; it still evaluates
    # false the moment the run is cancelled, so Cancel workflow remains an
    # effective stop button here. The explicit needs.*.result checks below
    # do the rest: block on a real failure of any gate (test, e2e-replay,
    # or - on the rare path where golden-master-guard did run - a failed
    # guard), but do not block on golden-master-guard's expected 'skipped'
    # result on this trigger.
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/master' &&
      needs.test.result == 'success' &&
      needs.e2e-replay.result == 'success' &&
      (needs.golden-master-guard.result == 'success' || needs.golden-master-guard.result == 'skipped')
    runs-on: ubuntu-latest
    needs: ['test', 'e2e-replay', 'golden-master-guard']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Repair node_modules/.bin symlinks
        run: node scripts/link-bins.js

      - name: Version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Build
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
