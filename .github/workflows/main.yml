name: main

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE on Node version: .nvmrc pins Node 16 because `npm run build`
      # fails on 18/20/22 (ERR_PACKAGE_PATH_NOT_EXPORTED from an old
      # postcss dependency) - see Phase 0. That constraint is build-only:
      # lint and test have been verified to pass identically on Node 16,
      # 18, 20 and 22. This job does not build, so it intentionally does
      # NOT track .nvmrc and instead pins Node 20 directly, because Node
      # 16 is EOL and does not install reliably via actions/setup-node on
      # current ubuntu-latest runners. The `deploy` job below still uses
      # Node 16 since it does build.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      # WORKAROUND: package-lock.json is lockfileVersion 2 but has no
      # "packages" object, so `npm ci` on modern npm links zero bins into
      # node_modules/.bin (eslint, react-scripts, etc. all "command not
      # found"). We can't regenerate the lockfile without invalidating the
      # golden-master verification against the pinned 2022 dependency
      # tree, so repair the bin symlinks ourselves. See scripts/link-bins.js.
      - name: Repair node_modules/.bin symlinks
        run: node scripts/link-bins.js

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test 2>&1 | tee test-output.log

      - name: Write coverage summary
        if: always()
        run: |
          {
            echo '## Coverage summary'
            echo
            echo '```'
            sed -n '/^File/,/^Ran all test suites/p' test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  golden-master-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone: the merge-base
          # comparison below needs it.
          fetch-depth: 0

      # Design spec section 7.3 (the stop rule) says: "CI enforces the
      # branch-name condition mechanically, so the fixture cannot drift by
      # accident." Until this job existed, no such job did - nothing in
      # this workflow read expected.json or checked for an oracle/ branch
      # prefix (see the "Correction" note appended to spec 7.3, issue #45).
      # This is that job.
      - name: Enforce the expected.json stop rule (design spec 7.3)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          CHANGED="$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA" -- src/golden/expected.json)"

          if [ -z "$CHANGED" ]; then
            echo "src/golden/expected.json is unchanged against the merge base ($MERGE_BASE). OK."
            exit 0
          fi

          case "$HEAD_REF" in
            oracle/*)
              echo "src/golden/expected.json changed, and branch '$HEAD_REF' is an approved oracle/ branch. OK."
              echo "This still requires the written per-value justification and explicit sign-off spec 7.3 calls for - confirm that happened in review."
              exit 0
              ;;
          esac

          {
            echo "::error::src/golden/expected.json was modified on branch '$HEAD_REF', which is not an oracle/ branch."
            echo
            echo "Design spec section 7.3 (the stop rule):"
            echo '  "If a value in expected.json moves, work stops. No fixing forward, no'
            echo '   regenerating the fixture, no assuming it is rounding."'
            echo
            echo "A deliberate correction to the golden master requires a dedicated oracle/*"
            echo "branch, a written justification per changed value, and explicit sign-off"
            echo "before expected.json is touched (spec 7.3, 'Deliberate correction')."
            echo
            echo "If this diff is a real regression: revert it, don't edit the fixture."
            echo "If it is a deliberate, reviewed correction to the recorded oracle values:"
            echo "re-open this change from a branch named oracle/<something>, with that"
            echo "justification and sign-off recorded in the PR description."
          } >&2
          exit 1

  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: ['test']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Repair node_modules/.bin symlinks
        run: node scripts/link-bins.js

      - name: Version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Build
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
