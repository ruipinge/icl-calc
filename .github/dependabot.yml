# Dependency maintenance. See #92.
#
# Three things are watched: the app at the repo root, the golden-master e2e
# harness (which has its own lockfile and was previously unwatched), and the
# actions used by .github/workflows/main.yml.
#
# Every group is declared twice, once per `applies-to`. `groups` defaults to
# version updates alone, and the bump that broke #89 was a *security* update,
# so the security half is the half that matters here.

version: 2

updates:
  # --------------------------------------------------------------- root npm
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      # Produces `build(deps):` and `build(deps-dev):`. Neither cuts a
      # release: only feat, fix, perf, revert and breaking changes do.
      # Verified by running the installed @semantic-release/commit-analyzer
      # against these exact message shapes.
      prefix: build
      prefix-development: build
      include: scope
    ignore:
      # Pinned exactly on purpose (#76) so formatting is reproducible across
      # machines and CI. Upgrade it deliberately, never on a schedule.
      #
      # Note the cost, so it is a decision rather than a side effect: `ignore`
      # is honoured for security updates as well as version updates, so an
      # advisory against prettier will not open a PR either. Accepted because
      # prettier formats source and does not build the shipped artifact; if
      # that stops being true, this entry is the first thing to revisit.
      - dependency-name: prettier

      # TypeScript 7 (the native port) has nothing in the lint toolchain that
      # can accept it: typescript-eslint@8.69.0 is the latest release and
      # peers typescript ">=4.8.4 <6.1.0", with no newer line published
      # (its only other dist-tag is canary 8.69.1-alpha.0, still 8.x).
      # Proposing the bump just produces a group PR that cannot install, so
      # it is ignored until typescript-eslint gains a supporting release.
      #
      # A range, not `update-types: semver-major`: that would also block
      # TypeScript 6, which "<6.1.0" explicitly admits. Only 7 and above are
      # unsupported, so only 7 and above are ignored. Remove this entry when
      # typescript-eslint's peer range moves; it is the whole reason it
      # exists. See #102, which tracks the sibling block on eslint 10.
      - dependency-name: typescript
        versions: ['>=7.0.0']

      # ESLint 10 is blocked by plugins that cap at 9 in their LATEST
      # published releases, so there is nothing to bump them to:
      #
      #   eslint-plugin-jsx-a11y@6.10.2  eslint "^3 || ... || ^9"
      #   eslint-plugin-react@7.37.5     eslint "^3 || ... || ^9.7"
      #
      # eslint-plugin-import was a third such blocker and is now gone,
      # replaced by eslint-plugin-import-x (#102), whose peer range already
      # includes 10. The other two have to publish support before eslint 10
      # can install at all, and until then the grouped bump can only produce
      # a PR that fails at `npm ci`.
      #
      # Same shape as the typescript entry above and for the same reason:
      # a range rather than update-types, so a future eslint 11 that the
      # ecosystem does support is not also blocked by this line. Remove it
      # once both plugins accept 10.
      - dependency-name: eslint
        versions: ['>=10.0.0']

    # Every install step runs `npm ci` without --legacy-peer-deps, so a
    # peer-linked set that arrives split cannot install. Each group below is
    # one peer edge read out of node_modules, not a guess at what looks
    # related:
    #
    #   @vitest/coverage-v8 peers vitest at an exact version, and
    #   @vitejs/plugin-react peers vite "^4.2.0 || ^5 || ^6 || ^7".
    #   typescript-eslint peers eslint "^8.57 || ^9 || ^10" and typescript
    #   ">=4.8.4 <6.1.0", so typescript belongs here rather than alone.
    #   @testing-library/react peers react, react-dom, @types/react and
    #   @types/react-dom at "^18 || ^19", plus @testing-library/dom "^10",
    #   and @sentry/react peers react "^16.14.0 || 17.x || 18.x || 19.x",
    #   so the Sentry SDK travels with React whether or not it stays (#42).
    groups:
      vite-vitest:
        patterns:
          - vite
          - '@vitejs/*'
          - vitest
          - '@vitest/*'
      vite-vitest-security:
        applies-to: security-updates
        patterns:
          - vite
          - '@vitejs/*'
          - vitest
          - '@vitest/*'

      eslint:
        patterns:
          - eslint
          - 'eslint-*'
          - '@eslint/*'
          - typescript-eslint
          - '@typescript-eslint/*'
          - typescript
          - globals
      eslint-security:
        applies-to: security-updates
        patterns:
          - eslint
          - 'eslint-*'
          - '@eslint/*'
          - typescript-eslint
          - '@typescript-eslint/*'
          - typescript
          - globals

      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
          - '@testing-library/*'
          - '@sentry/*'
      react-security:
        applies-to: security-updates
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
          - '@testing-library/*'
          - '@sentry/*'

  # ---------------------------------------------------------------- e2e npm
  # The golden-master capture/replay harness is deliberately separate from the
  # app's dependency tree and keeps its own lockfile. Two direct dependencies,
  # neither peer-linked to the other, so nothing to group.
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      prefix-development: build
      include: scope

  # --------------------------------------------------------- github-actions
  # Four actions, bumped once already in #74 and free to drift again. Monthly
  # and grouped, so they arrive as one reviewable PR rather than four.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - '*'
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
