- text: Name
- textbox "Name":
  - /placeholder: enter patient name
- text: Date of Birth
- textbox "Date of Birth":
  - /placeholder: yyyy-mm-dd
- text: Age, years
- textbox "Age, years" [disabled]
- text: Eye
