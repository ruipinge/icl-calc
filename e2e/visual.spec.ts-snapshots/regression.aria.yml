- navigation:
  - link "ICL Size Calc":
    - /url: /icl-calc/
  - button "Reset"
- list:
  - listitem:
    - link "Patient":
      - /url: "#/"
  - listitem:
    - link "Biometric Normality":
      - /url: "#/normality"
  - listitem:
    - link "Floating Matrix":
      - /url: "#/matrix"
  - listitem:
    - link "Regression":
      - /url: "#/regression"
- separator
- heading "Vault Prediction" [level=4]
- table:
  - rowgroup:
    - row "Lens Size Vault (μm) Corneal Endothelium to ICL (mm)":
      - columnheader "Lens Size"
      - columnheader "Vault (μm)"
      - columnheader "Corneal Endothelium to ICL (mm)"
  - rowgroup:
    - row /\d+\.\d+ mm \d+\.\d+ -\d+\.\d+/:
      - columnheader /\d+\.\d+ mm/
      - cell /\d+\.\d+/
      - cell /-\d+\.\d+/
    - row /\d+\.\d+ mm \d+\.\d+ -\d+\.\d+/:
      - columnheader /\d+\.\d+ mm/
      - cell /\d+\.\d+/
      - cell /-\d+\.\d+/
    - row /\d+\.\d+ mm \d+\.\d+ -\d+\.\d+/:
      - columnheader /\d+\.\d+ mm/
      - cell /\d+\.\d+/
      - cell /-\d+\.\d+/
- separator
- heading /Probability of \d+ < Vault < \d+ \(μm\)/ [level=4]
- table:
  - rowgroup:
    - row "Lens Size Probability (%)":
      - columnheader "Lens Size"
      - columnheader "Probability (%)"
  - rowgroup:
    - row /\d+\.\d+ mm 0/:
      - columnheader /\d+\.\d+ mm/
      - cell "0"
    - row /\d+\.\d+ mm 0/:
      - columnheader /\d+\.\d+ mm/
      - cell "0"
    - row /\d+\.\d+ mm 0/:
      - columnheader /\d+\.\d+ mm/
      - cell "0"
